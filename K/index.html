  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #080808;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .main-wrapper {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    /* DP Container */
    .profile-frame {
      position: relative;
      margin-bottom: 20px;
    }

    .dp-container {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, #D4AF37 0%, #222222 50%, #AA771C 100%);
    }

    .profile-dp {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    /* Custom Metallic Verified Badge SVG */
    .verified-svg {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* Title & SVG Sparkle Section */
    .channel-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .channel-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Custom Golden Sparkle SVG */
    .sparkle-svg {
      width: 22px;
      height: 22px;
      fill: url(#gold-gradient);
      flex-shrink: 0;
    }

    .sub-tagline {
      font-size: 14px;
      color: #8E8E93;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .highlight-gold {
      color: #D4AF37;
      font-weight: 600;
    }

    /* Trust Stats Grid */
    .luxury-stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #121214;
      border: 1px solid #222226;
      border-radius: 16px;
      padding: 14px 8px;
      margin-bottom: 28px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .stat-box:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 15%;
      height: 70%;
      width: 1px;
      background: #222226;
    }

    .stat-number {
      font-size: 16px;
      font-weight: 700;
      color: #D4AF37;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6E6E73;
      margin-top: 3px;
      font-weight: 600;
    }

    /* Exact User Provided Button CSS */
    .button {
      --black: #000000;
      --ch-black: #141414;
      --eer-black: #1b1b1b;
      --night-rider: #2e2e2e;
      --white: #ffffff;
      --af-white: #f3f3f3;
      --ch-white: #e1e1e1;
      border-radius: 20px;
      width: 350px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0px 15px;
      border: none;
      color: white;
      position: relative;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition-duration: 0.2s;
      background-color: var(--ch-black);
      text-decoration: none;
    }

    .button:before,
    .button:after {
      content: "";
      position: absolute;
      left: -1px;
      top: -1px;
      border-radius: 22px;
      background: linear-gradient(
        45deg,
        var(--ch-black),
        var(--eer-black),
        var(--night-rider),
        var(--ch-white),
        var(--night-rider),
        var(--eer-black),
        var(--ch-black),
        var(--ch-black)
      );
      background-size: 400%;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      z-index: -1;
      animation: steam 20s linear infinite;
    }

    @keyframes steam {
      0% {
        background-position: 0 0;
      }
      50% {
        background-position: 400% 0;
      }
      100% {
        background-position: 0 0;
      }
    }

    .button:after {
      filter: blur(50px);
    }

    .tg-svg {
      width: 18px;
      height: 18px;
      fill: #FFFFFF;
      flex-shrink: 0;
    }

    .micro-copy {
      margin-top: 14px;
      font-size: 11px;
      color: #666666;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Floating Advertiser Widget (Bottom Left) */
    .advertiser-widget {
      position: fixed;
      bottom: 20px;
      left: 16px;
      background: #141416;
      border: 1px solid #28282D;
      border-radius: 50px;
      padding: 6px 14px 6px 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 9999;
      transform: translateY(150px);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    }

    .advertiser-widget.show {
      transform: translateY(0);
      opacity: 1;
    }

    .advertiser-dp {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .advertiser-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .advertiser-tag {
      font-size: 9px;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .advertiser-title {
      font-size: 12px;
      color: #FFFFFF;
      font-weight: 700;
    }

  <script>
    function trackConversion() {
